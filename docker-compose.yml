services:
  migrate:
    container_name: ${APP_NAME}-migrate
    image: ${APP_IMAGE}
    command: node dist/db/migrate.js
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        required: false # skipped when db runs on a separate server (not in this compose project)
    restart: no

  app:
    container_name: ${APP_NAME}-app
    image: ${APP_IMAGE}
    env_file: .env
    ports:
      - '127.0.0.1:${PORT:-5000}:5000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
